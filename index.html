<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dinusha Pushparajah | Spectral Intelligence Lab</title>
    <meta name="description" content="Research-grade Machine Learning Portfolio" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lab: {
                bg: '#030305',
                surface: '#0a0a0c',
                text: '#e0e0e0',
                dim: '#666666',
                cyan: '#00f3ff',
                magenta: '#ff00aa',
                lime: '#ccff00',
                purple: '#bd00ff'
              }
            },
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        width: 100%;
      }
      body {
        background-color: #030305;
        color: #e0e0e0;
        overflow-x: hidden;
      }
      /* Custom Scrollbar for Lab feel */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #030305;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f3ff;
      }
      .glitch-text {
        position: relative;
      }
      .glitch-text::before, .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #030305;
      }
      .glitch-text::before {
        left: 2px;
        text-shadow: -1px 0 #ff00aa;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      .glitch-text::after {
        left: -2px;
        text-shadow: -1px 0 #00f3ff;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim2 5s infinite linear alternate-reverse;
      }
      @keyframes glitch-anim {
        0% { clip: rect(13px, 9999px, 81px, 0); }
        5% { clip: rect(74px, 9999px, 86px, 0); }
        10% { clip: rect(32px, 9999px, 20px, 0); }
        15% { clip: rect(2px, 9999px, 1px, 0); }
        20% { clip: rect(45px, 9999px, 66px, 0); }
        100% { clip: rect(13px, 9999px, 81px, 0); }
      }
      @keyframes glitch-anim2 {
        0% { clip: rect(65px, 9999px, 100px, 0); }
        5% { clip: rect(5px, 9999px, 32px, 0); }
        10% { clip: rect(25px, 9999px, 5px, 0); }
        15% { clip: rect(98px, 9999px, 82px, 0); }
        20% { clip: rect(2px, 9999px, 66px, 0); }
        100% { clip: rect(65px, 9999px, 100px, 0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.4.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "three": "https://esm.sh/three@^0.182.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
